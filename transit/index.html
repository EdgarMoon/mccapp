<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>출근 버스 — Gare Centrale</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #map { position: absolute; inset: 0; }
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: rgba(255,255,255,.94);
    border-bottom: 1px solid #ddd; font-size: 15px; font-weight: 700;
  }
  #header .sub { font-weight: 400; font-size: 12px; color: #666; margin-left: auto; }
  #header button { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 14px;
    background: linear-gradient(transparent, rgba(255,255,255,.96) 30%);
  }
  .card {
    flex: 0 0 168px; background: #fff; border-radius: 12px; padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer; border-top: 5px solid #999;
  }
  .card .route { font-size: 20px; font-weight: 800; }
  .card .dir { font-size: 12px; color: #555; margin-top: 2px; }
  .card .stop { font-size: 12px; color: #333; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .walk { font-size: 11px; color: #888; }
  .card .times { font-size: 17px; font-weight: 700; margin-top: 6px; color: #111; }
  .card .times .soon { color: #d32f2f; }
  .card .none { font-size: 13px; color: #999; margin-top: 6px; }
  #legend {
    position: absolute; top: 56px; right: 10px; z-index: 1000; background: rgba(255,255,255,.92);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.2);
  }
  #legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bus-badge {
    width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4);
  }
  .bus-badge.stale { opacity: .45; }
  .key-pin {
    width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.5);
    color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  #keyOverlay {
    position: absolute; inset: 0; z-index: 2000; background: rgba(255,255,255,.97);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #keyOverlay.show { display: flex; }
  #keyBox { max-width: 420px; width: 100%; }
  #keyBox h2 { font-size: 18px; margin: 0 0 8px; }
  #keyBox p { font-size: 13px; color: #555; line-height: 1.6; }
  #keyBox input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; margin: 8px 0; }
  #keyBox button { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; color: #fff; background: #1E88E5; border: 0; border-radius: 10px; cursor: pointer; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.7; margin: 10px 12px; }
  .leaflet-popup-content b.arr { font-size: 15px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="header">
  <span>🚌 출근 버스</span>
  <span class="sub" id="updated">불러오는 중…</span>
  <button id="btnRefresh" title="새로고침">↻</button>
  <button id="btnKey" title="API 키 설정">⚙</button>
</div>
<div id="legend"></div>
<div id="panel"></div>
<div id="keyOverlay">
  <div id="keyBox">
    <h2>STM API 키 입력</h2>
    <p>STM 개발자 포털에서 발급받은 키를 입력하세요.<br>
    포털 → Applications → <b>mcc-bus-tracker</b> → Authentication &amp; Credentials → <b>web-app-key</b> → API Key / Client ID<br>
    키는 이 기기의 브라우저에만 저장됩니다.</p>
    <input id="keyInput" type="password" placeholder="API 키 붙여넣기" autocomplete="off">
    <button id="keySave">저장하고 시작</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
