<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>받아쓰기 연습</title>
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f7f1e1; color: #333; }
#app { max-width: 700px; margin: 0 auto; padding: 28px 20px 80px; }
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 2rem; margin: 10px 0 6px; }
h2 { font-size: 1.4rem; margin: 26px 0 10px; }
h3 { font-size: 1.1rem; margin: 26px 0 10px; }
.subtitle { color: #8a7f66; margin: 0 0 26px; line-height: 1.7; }
.btn { display: inline-block; border: none; border-radius: 999px; padding: 14px 26px; font-size: 1.02rem; background: #fff; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,.10); cursor: pointer; }
.btn.primary { background: #2b2118; color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; padding: 8px 2px; color: #8a7f66; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; align-items: center; }
.card { background: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin: 12px 0; }
.card .list-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card .meta { color: #999; font-size: .9rem; margin-top: 4px; }
.mini-btn { border: 1px solid #ddd; background: #fff; border-radius: 999px; padding: 8px 16px; font-size: .9rem; cursor: pointer; }
.mini-btn.danger { color: #c0392b; border-color: #e5b3ac; }
label.lbl { display: block; margin: 20px 0 8px; font-weight: 700; }
textarea, input[type="text"], select { font-size: 1rem; border: 1px solid #ddd; border-radius: 12px; padding: 12px 14px; width: 100%; box-sizing: border-box; background: #fff; font-family: inherit; }
textarea { line-height: 1.8; resize: vertical; }
.seg { display: flex; background: #ece4cf; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: none; background: transparent; padding: 13px; border-radius: 10px; font-size: 1rem; cursor: pointer; color: #777; }
.seg button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.14); font-weight: 700; color: #333; }
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.settings label { font-size: .92rem; color: #666; }
.settings select { margin-top: 6px; }
.hint { color: #aaa; font-size: .85rem; margin-top: 8px; line-height: 1.6; }
#word-count { float: right; color: #999; font-weight: 400; font-size: .9rem; }
#practice-progress { font-size: 1.15rem; font-weight: 700; }
.progress { height: 10px; background: #e7ddc4; border-radius: 99px; overflow: hidden; margin: 12px 0 28px; }
#progress-bar { height: 100%; width: 0; background: #2b2118; border-radius: 99px; transition: width .3s; }
.big-listen { width: 124px; height: 124px; border-radius: 50%; font-size: 3rem; background: #2b2118; color: #fff; border: none; display: block; margin: 34px auto; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.answer { font-size: 2.4rem; text-align: center; margin: 26px 0; overflow-wrap: anywhere; font-weight: 700; }
.center { text-align: center; }
.big-msg { font-size: 1.5rem; text-align: center; margin: 60px 0 10px; line-height: 1.6; }
.review-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #f0e9d6; font-size: 1.15rem; }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2b2118; color: #fff; padding: 12px 22px; border-radius: 999px; font-size: .95rem; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; }
.pencil { font-size: 2.6rem; }
.listen-note { text-align: center; color: #8a7f66; font-size: 1.1rem; margin-top: 8px; }
.lang-switch { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.lang-switch .seg { max-width: 280px; }
.lang-switch .seg button { padding: 8px 12px; font-size: .85rem; }
</style>
</head>
<body>
<div id="app">
  <div class="lang-switch"><div class="seg" id="ui-lang-seg">
    <button type="button" data-ui-lang="ko" class="on">한국어</button>
    <button type="button" data-ui-lang="en">English</button>
    <button type="button" data-ui-lang="fr">Français</button>
  </div></div>

  <!-- 홈 -->
  <section id="screen-home" class="screen active">
    <h1 data-i18n="home_title">이번 주 받아쓰기</h1>
    <p class="subtitle" data-i18n="home_sub">단어를 넣으면 또렷하게 읽어줘요.<br>아이는 종이에 쓰기만 하면 돼요.</p>
    <div class="row">
      <button id="btn-go-editor" class="btn primary" data-i18n="home_make">목록 만들기</button>
      <button id="btn-go-practice" class="btn" data-i18n="home_practice">연습하기</button>
    </div>
    <h2 data-i18n="home_saved">저장된 목록</h2>
    <div id="saved-lists"></div>
  </section>

  <!-- 목록 편집 -->
  <section id="screen-editor" class="screen">
    <button class="btn ghost" data-go="screen-home" data-i18n="back">← 돌아가기</button>
    <h2 data-i18n="ed_title">단어 목록</h2>
    <label class="lbl" for="list-name" data-i18n="ed_name">목록 이름</label>
    <input type="text" id="list-name" data-i18n-ph="ed_name_ph" placeholder="예: 9월 4주 받아쓰기">
    <label class="lbl" data-i18n="ed_tts_lang">읽어줄 언어</label>
    <div class="seg" id="lang-seg">
      <button type="button" data-lang="fr" class="on">Français</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <label class="lbl" for="words-input"><span data-i18n="ed_words">한 줄에 단어 하나씩</span> <span id="word-count">0개</span></label>
    <textarea id="words-input" rows="8" placeholder="bonjour&#10;école"></textarea>
    <div class="row">
      <label class="btn">📷 <span data-i18n="ed_ocr">사진으로 입력</span><input type="file" id="ocr-input" accept="image/*" hidden></label>
      <span id="ocr-status" class="hint"></span>
    </div>
    <p class="hint" data-i18n="ed_hint">쉼표(,)나 세미콜론(;)으로 이어 붙여도 각각 나눠서 읽어요. 문장은 한 줄에 하나씩 넣으면 통째로 읽어줘요.</p>
    <label class="lbl" data-i18n="ed_settings">연습 설정</label>
    <div class="settings">
      <label><span data-i18n="ed_repeats">반복 횟수</span>
        <select id="set-repeats">
          <option value="1" data-i18n="times_1">1번</option>
          <option value="2" data-i18n="times_2" selected>2번</option>
          <option value="3" data-i18n="times_3">3번</option>
          <option value="4" data-i18n="times_4">4번</option>
          <option value="5" data-i18n="times_5">5번</option>
        </select>
      </label>
      <label><span data-i18n="ed_rate">읽기 속도</span>
        <select id="set-rate">
          <option value="0.7" data-i18n="rate_slow">느리게</option>
          <option value="0.9" data-i18n="rate_normal" selected>보통</option>
          <option value="1.1" data-i18n="rate_fast">빠르게</option>
        </select>
      </label>
      <label><span data-i18n="ed_gap">단어 간격</span>
        <select id="set-gap">
          <option value="1000" data-i18n="sec_1">1초</option>
          <option value="2000" data-i18n="sec_2" selected>2초</option>
          <option value="3000" data-i18n="sec_3">3초</option>
        </select>
      </label>
      <label><span data-i18n="ed_order">순서</span>
        <select id="set-order">
          <option value="seq" data-i18n="order_seq" selected>순서대로</option>
          <option value="shuffle" data-i18n="order_shuffle">무작위</option>
        </select>
      </label>
      <label><span data-i18n="ed_mode">연습 방식</span>
        <select id="set-mode">
          <option value="practice" data-i18n="mode_practice" selected>단어별 연습</option>
          <option value="test" data-i18n="mode_test">전체 시험</option>
        </select>
      </label>
      <label><span data-i18n="ed_autonext">자동 넘기기</span><br>
        <input type="checkbox" id="set-autonext" style="width:22px;height:22px;margin-top:8px;accent-color:#2b2118;">
      </label>
      <label><span data-i18n="ed_autonext_delay">대기 시간</span>
        <select id="set-autonext-delay" disabled>
          <option value="3000" data-i18n="sec_3">3초</option>
          <option value="4000" data-i18n="sec_4" selected>4초</option>
          <option value="5000" data-i18n="sec_5">5초</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button id="btn-save-list" class="btn" data-i18n="ed_save">저장</button>
      <button id="btn-start-practice" class="btn primary" data-i18n="ed_start">연습 시작</button>
    </div>
    <h3 data-i18n="ed_share">다른 기기로 보내기</h3>
    <div class="row">
      <button id="btn-make-code" class="btn" data-i18n="ed_make_code">연습 코드 만들기·복사</button>
      <button id="btn-import-code" class="btn" data-i18n="ed_import_code">코드로 가져오기</button>
    </div>
    <textarea id="code-output" rows="3" data-i18n-ph="ed_code_ph" placeholder="연습 코드가 여기에 표시돼요. 가져올 때는 받은 코드를 여기에 붙여넣고 '코드로 가져오기'를 누르세요."></textarea>
  </section>

  <!-- 연습 -->
  <section id="screen-practice" class="screen">
    <button class="btn ghost" data-go="screen-home" data-i18n="stop">← 그만하기</button>
    <div id="practice-progress">0 / 0</div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div id="practice-area"></div>
  </section>

</div>
<div id="toast"></div>

}};
var UI_LANG_KEY = 'dictation-ui-lang';
var uiLang = 'ko';
function t(key){
  var d = I18N[uiLang] || I18N.ko;
  var v = d[key];
  return (typeof v === 'string') ? v : (I18N.ko[key] || key);
}
function applyI18n(){
  document.documentElement.lang = uiLang;
  document.title = t('title');
  var els = document.querySelectorAll('[data-i18n]');
  for(var i=0;i<els.length;i++){
    els[i].innerHTML = t(els[i].getAttribute('data-i18n'));
  }
  var phs = document.querySelectorAll('[data-i18n-ph]');
  for(var j=0;j<phs.length;j++){
    phs[j].setAttribute('placeholder', t(phs[j].getAttribute('data-i18n-ph')));
  }
  var btns = $('ui-lang-seg').querySelectorAll('button');
  for(var k=0;k<btns.length;k++){
    btns[k].classList.toggle('on', btns[k].getAttribute('data-ui-lang') === uiLang);
  }
  updateCount();
  renderHome();
}
function setUiLang(l){
  if(!I18N[l]) l = 'ko';
  uiLang = l;
  try{ localStorage.setItem(UI_LANG_KEY, l); }catch(e){}
  applyI18n();
}
function loadUiLang(){
  try{
    var s = localStorage.getItem(UI_LANG_KEY);
    if(s && I18N[s]) uiLang = s;
  }catch(e){}
}

function toast(msg){
  var t2 = $('toast');
  t2.textContent = msg;
  t2.classList.add('show');
  clearTimeout(t2._h);
  t2._h = setTimeout(function(){ t2.classList.remove('show'); }, 2200);
}

/* ---------- 저장소 ---------- */
var LS_KEY = 'dictation-app-v1';
var store = { lists: [], lastId: null };
function loadStore(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.lists) store = d; }
  }catch(e){}
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
}

/* ---------- 단어 파싱 ---------- */
function parseWords(text){
  return String(text || '').split(/[\n,;]+/).map(function(s){
    return s.trim().replace(/^\s*(?:\d+[.)]|[•\-–*])\s*/, '').trim();
  }).filter(function(s){ return s.length > 0; });
}

/* ---------- TTS ---------- */
function pickVoice(lang){
  try{
    var vs = speechSynthesis.getVoices() || [];
    var prefix = (lang === 'fr') ? 'fr' : 'en';
    for(var i=0;i<vs.length;i++){
      if(vs[i].lang && vs[i].lang.toLowerCase().indexOf(prefix) === 0) return vs[i];
    }
  }catch(e){}
  return null;
}
function speakOnce(text, lang, rate){
  return new Promise(function(resolve){
    var done = false;
    var fin = function(){ if(!done){ done = true; resolve(); } };
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (lang === 'fr') ? 'fr-FR' : 'en-US';
      u.rate = rate || 0.9;
      var v = pickVoice(lang);
      if(v) u.voice = v;
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
      setTimeout(fin, 15000);
    }catch(e){ fin(); }
  });
}
var runId = 0;
function stopAll(){
  runId++;
  try{ speechSynthesis.cancel(); }catch(e){}
}
async function playWord(text, cfg, my){
  for(var r=0; r<cfg.repeats; r++){
    if(my !== runId) return;
    await speakOnce(text, cfg.lang, cfg.rate);
    if(my !== runId) return;
    await wait(cfg.gap);
  }
}

/* ---------- 연습 코드 ---------- */
var _te = (typeof TextEncoder !== 'undefined') ? new TextEncoder() : null;
var _td = (typeof TextDecoder !== 'undefined') ? new TextDecoder() : null;
function encCode(obj){
  var json = JSON.stringify(obj);
  var bytes = _te ? _te.encode(json) : null;
  var bin = '';
  if(bytes){ for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]); }
  else { bin = unescape(encodeURIComponent(json)); }
  return btoa(bin);
}
function decCode(code){
  var bin = atob(String(code).trim().replace(/\s+/g,''));
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  var json = _td ? _td.decode(bytes) : decodeURIComponent(escape(bin));
  return JSON.parse(json);
}

/* ---------- 화면 전환 ---------- */
function go(id){
  stopAll();
  var screens = document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.remove('active');
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ---------- 홈 ---------- */
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderHome(){
  var box = $('saved-lists');
  box.innerHTML = '';
  if(!store.lists.length){
    box.innerHTML = '<p class="hint">' + esc(t('home_empty')) + '</p>';
    return;
  }
  store.lists.forEach(function(L){
    var div = document.createElement('div');
    div.className = 'card';
    var suffix = t('count_suffix');
    div.innerHTML =
      '<div class="list-item"><div><strong>'+esc(L.name)+'</strong>' +
      '<div class="meta">'+(L.lang==='fr'?'Français':'English')+' · '+L.words.length+(suffix?suffix:'')+'</div></div>' +
      '<div class="row" style="margin:0">' +
      '<button class="mini-btn" data-act="practice">'+esc(t('practice_btn'))+'</button>' +
      '<button class="mini-btn" data-act="edit">'+esc(t('edit_btn'))+'</button>' +
      '<button class="mini-btn danger" data-act="del">'+esc(t('del_btn'))+'</button>' +
      '</div></div>';
    div.querySelector('[data-act="practice"]').onclick = function(){ startWithList(L); };
    div.querySelector('[data-act="edit"]').onclick = function(){ loadIntoEditor(L); go('screen-editor'); };
    div.querySelector('[data-act="del"]').onclick = function(){
      if(confirm(t('confirm_del')(L.name))){
        store.lists = store.lists.filter(function(x){ return x.id !== L.id; });
        if(store.lastId === L.id) store.lastId = null;
        saveStore(); renderHome();
      }
    };
    box.appendChild(div);
  });
}

/* ---------- 에디터 ---------- */
var editorLang = 'fr';
function setEditorLang(l){
  editorLang = l;
  var btns = $('lang-seg').querySelectorAll('button');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-lang')===l);
}
function updateCount(){
  var n = parseWords($('words-input').value).length;
  var suffix = t('count_suffix');
  $('word-count').textContent = suffix ? (n + suffix) : String(n);
}
function editorConfig(){
  return {
    v: 1,
    name: $('list-name').value.trim(),
    lang: editorLang,
    words: parseWords($('words-input').value),
    repeats: parseInt($('set-repeats').value, 10),
    rate: parseFloat($('set-rate').value),
    gap: parseInt($('set-gap').value, 10),
    order: $('set-order').value,
    mode: $('set-mode').value,
    autonext: $('set-autonext').checked,
    autonextDelay: parseInt($('set-autonext-delay').value, 10)
  };
}
function fillEditor(cfg){
  $('list-name').value = cfg.name || '';
  setEditorLang(cfg.lang === 'en' ? 'en' : 'fr');
  $('words-input').value = (cfg.words || []).join('\n');
  if(cfg.repeats) $('set-repeats').value = String(cfg.repeats);
  if(cfg.rate) $('set-rate').value = String(cfg.rate);
  if(cfg.gap) $('set-gap').value = String(cfg.gap);
  if(cfg.order) $('set-order').value = cfg.order;
  if(cfg.mode) $('set-mode').value = cfg.mode;
  $('set-autonext').checked = !!cfg.autonext;
  $('set-autonext-delay').disabled = !cfg.autonext;
  if(cfg.autonextDelay) $('set-autonext-delay').value = String(cfg.autonextDelay);
  updateCount();
}
function loadIntoEditor(L){
  fillEditor({ name: L.name, lang: L.lang, words: L.words,
    repeats: L.repeats, rate: L.rate, gap: L.gap, order: L.order, mode: L.mode });
  $('btn-save-list').dataset.editId = L.id;
}
function saveCurrentList(){
  var cfg = editorConfig();
  if(!cfg.words.length){ toast(t('t_need_words')); return null; }
  if(!cfg.name) cfg.name = t('default_name')(new Date().toLocaleDateString(uiLang==='ko'?'ko-KR':uiLang==='fr'?'fr-FR':'en-US'));
  var editId = $('btn-save-list').dataset.editId;
  var L = { id: editId || ('l' + Date.now()), name: cfg.name, lang: cfg.lang, words: cfg.words,
    repeats: cfg.repeats, rate: cfg.rate, gap: cfg.gap, order: cfg.order, mode: cfg.mode,
    updatedAt: Date.now() };
  var idx = -1;
  for(var i=0;i<store.lists.length;i++) if(store.lists[i].id === L.id) idx = i;
  if(idx >= 0) store.lists[idx] = L; else store.lists.unshift(L);
  store.lastId = L.id;
  delete $('btn-save-list').dataset.editId;
  saveStore(); renderHome();
  toast(t('t_saved'));
  return L;
}

/* ---------- 사진 OCR ---------- */
var _tessLoading = null;
function loadTesseract(){
  if(typeof Tesseract !== 'undefined') return Promise.resolve();
  if(!_tessLoading){
    _tessLoading = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = function(){ resolve(); };
      s.onerror = function(){ _tessLoading = null; reject(new Error('load')); };
      document.head.appendChild(s);
    });
  }
  return _tessLoading;
}
function wireOcr(){
  $('ocr-input').addEventListener('change', async function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var st = $('ocr-status');
    st.textContent = t('ocr_prep');
    try{
      await loadTesseract();
      st.textContent = t('ocr_working');
      var worker = await Tesseract.createWorker(['fra','eng']);
      var res = await worker.recognize(file);
      await worker.terminate();
      var text = (res && res.data && res.data.text || '').trim();
      var ta = $('words-input');
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + text;
      updateCount();
      st.textContent = text ? t('ocr_done') : t('ocr_none');
    }catch(err){
      st.textContent = t('ocr_fail');
    }
    e.target.value = '';
  });
}

/* ---------- 연습 ---------- */
function orderedWords(cfg){
  var w = cfg.words.slice();
  if(cfg.order === 'shuffle'){
    for(var i=w.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = w[i]; w[i] = w[j]; w[j] = tmp;
    }
  }
  return w;
}
function setProgress(i, n){
  $('practice-progress').textContent = Math.min(i+1,n) + ' / ' + n;
  $('progress-bar').style.width = (n ? ((i+1)/n*100) : 0) + '%';
}
function startWithList(L){
  startPractice({ v:1, name:L.name, lang:L.lang, words:L.words.slice(),
    repeats:L.repeats||2, rate:L.rate||0.9, gap:L.gap||2000, order:L.order||'seq', mode:L.mode||'practice',
    autonext: !!L.autonext, autonextDelay: L.autonextDelay || 4000 });
}
function startPractice(cfg){
  if(!cfg.words.length){ toast(t('t_need_words')); return; }
  go('screen-practice');
  if(cfg.mode === 'test') runTestMode(cfg); else runWordMode(cfg);
}

function runWordMode(cfg){
  var order = orderedWords(cfg);
  var i = 0;
  var my = ++runId;
  showWord();
  function showWord(){
    if(my !== runId) return;
    setProgress(i, order.length);
    var area = $('practice-area');
    area.innerHTML =
      '<div class="center"><div class="pencil">✏️</div>' +
      '<p class="listen-note">' + t('listen_note') + '</p></div>' +
      '<button class="big-listen" id="btn-replay" aria-label="replay">🔊</button>' +
      '<div class="answer" id="answer" style="display:none"></div>' +
      '<div class="row" style="justify-content:center">' +
      '<button class="btn" id="btn-reveal">' + esc(t('reveal')) + '</button>' +
      '<button class="btn primary" id="btn-next">' + esc(i+1 < order.length ? t('next_word') : t('finish')) + '</button>' +
      '</div>' +
      (cfg.autonext ? '<p class="hint center">' + esc(t('autonext_note')(Math.round(cfg.autonextDelay/1000))) + '</p>' : '');
    var wordMy = ++runId;
    my = wordMy;
    function playThenMaybeAdvance(token){
      (async function(){
        await playWord(order[i], cfg, token);
        if(token !== runId) return;
        if(!cfg.autonext) return;
        await wait(cfg.autonextDelay);
        if(token !== runId) return;
        var nb = $('btn-next');
        if(nb) nb.click();
      })();
    }
    playThenMaybeAdvance(wordMy);
    $('btn-replay').onclick = function(){ var m = ++runId; my = m; playThenMaybeAdvance(m); };
    $('btn-reveal').onclick = function(){
      var a = $('answer');
      if(a.style.display === 'none'){ a.textContent = order[i]; a.style.display = 'block'; $('btn-reveal').textContent = t('hide'); }
      else { a.style.display = 'none'; $('btn-reveal').textContent = t('reveal'); }
    };
    $('btn-next').onclick = function(){
      stopAll();
      i++;
      if(i < order.length){ my = ++runId; showWord(); }
      else showCompletion(order, cfg);
    };
  }
}

async function runTestMode(cfg){
  var order = orderedWords(cfg);
  var my = ++runId;
  var area = $('practice-area');
  area.innerHTML =
    '<div class="center"><div class="pencil">✏️</div>' +
    '<p class="listen-note">' + t('test_note') + '</p></div>' +
    '<div class="row" style="justify-content:center"><button class="btn" id="btn-stop-test">' + esc(t('stop_listen')) + '</button></div>';
  $('btn-stop-test').onclick = function(){ stopAll(); go('screen-home'); };
  for(var i=0;i<order.length;i++){
    if(my !== runId) return;
    setProgress(i, order.length);
    await playWord(order[i], cfg, my);
  }
  if(my !== runId) return;
  showCompletion(order, cfg);
}

function showCompletion(order, cfg){
  stopAll();
  setProgress(order.length-1, order.length);
  var area = $('practice-area');
  var html = '<p class="big-msg">' + order.length + ' ' + t('done_msg') + '</p>' +
    '<div class="row" style="justify-content:center">' +
    '<button class="btn primary" id="btn-again">' + esc(t('again')) + '</button>' +
    '<button class="btn" id="btn-done-home">' + esc(t('go_home')) + '</button></div>' +
    '<h3>' + esc(t('review')) + '</h3>';
  order.forEach(function(w, idx){
    html += '<div class="review-row"><span>'+esc(w)+'</span><button class="mini-btn" data-idx="'+idx+'">🔊</button></div>';
  });
  area.innerHTML = html;
  var btns = area.querySelectorAll('[data-idx]');
  for(var k=0;k<btns.length;k++){
    btns[k].onclick = (function(idx){
      return function(){ var m = ++runId; speakOnce(order[idx], cfg.lang, cfg.rate); };
    })(k);
  }
  $('btn-again').onclick = function(){ startPractice(cfg); };
  $('btn-done-home').onclick = function(){ go('screen-home'); };
}

/* ---------- 이벤트 연결 ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.onclick = function(){ go(b.getAttribute('data-go')); };
  });
  var uiBtns = $('ui-lang-seg').querySelectorAll('button');
  for(var u=0;u<uiBtns.length;u++){
    uiBtns[u].onclick = (function(b){ return function(){ setUiLang(b.getAttribute('data-ui-lang')); }; })(uiBtns[u]);
  }
  $('btn-go-editor').onclick = function(){
    delete $('btn-save-list').dataset.editId;
    go('screen-editor');
  };
  $('btn-go-practice').onclick = function(){
    var L = null;
    for(var i=0;i<store.lists.length;i++) if(store.lists[i].id === store.lastId) L = store.lists[i];
    if(!L && store.lists.length) L = store.lists[0];
    if(L) startWithList(L); else go('screen-editor');
  };
  var segBtns = $('lang-seg').querySelectorAll('button');
  for(var s=0;s<segBtns.length;s++){
    segBtns[s].onclick = (function(b){ return function(){ setEditorLang(b.getAttribute('data-lang')); }; })(segBtns[s]);
  }
  $('words-input').addEventListener('input', updateCount);
  $('set-autonext').onchange = function(){
    $('set-autonext-delay').disabled = !this.checked;
  };
  $('btn-save-list').onclick = saveCurrentList;
  $('btn-start-practice').onclick = function(){
    var L = saveCurrentList();
    if(L) startWithList(L);
  };
  $('btn-make-code').onclick = function(){
    var cfg = editorConfig();
    if(!cfg.words.length){ toast(t('t_need_words')); return; }
    var code = encCode(cfg);
    $('code-output').value = code;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){ toast(t('t_code_copied')); }, function(){ fallbackCopy(); });
      } else fallbackCopy();
    }catch(e){ fallbackCopy(); }
    function fallbackCopy(){
      $('code-output').select();
      try{ document.execCommand('copy'); toast(t('t_code_copied')); }
      catch(e2){ toast(t('t_code_manual')); }
    }
  };
  $('btn-import-code').onclick = function(){
    var code = $('code-output').value;
    if(!code.trim()){ toast(t('t_code_paste')); return; }
    try{
      var cfg = decCode(code);
      if(!cfg || !cfg.words || !cfg.words.length) throw new Error('empty');
      if(!cfg.name) cfg.name = t('imported_name')(new Date().toLocaleDateString(uiLang==='ko'?'ko-KR':uiLang==='fr'?'fr-FR':'en-US'));
      fillEditor(cfg);
      delete $('btn-save-list').dataset.editId;
      toast(t('t_imported'));
    }catch(e){ toast(t('t_code_fail')); }
  };
  wireOcr();
}

/* ---------- 시작 ---------- */
loadUiLang();
loadStore();
wire();
applyI18n();
try{
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); };
  }
}catch(e){}
</script>
</body>
